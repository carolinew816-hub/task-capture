<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 태스크 캡처</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    padding: 20px;
    font-size: 14px;
    line-height: 1.5;
  }
  .header { margin-bottom: 20px; }
  .header h1 { font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .header .date { font-size: 12px; color: #888; }
  .badges { display: flex; gap: 6px; margin-top: 8px; }
  .badge {
    font-size: 11px; font-weight: 500; padding: 2px 9px;
    border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
  }
  .badge-today { background: #EEEDFE; color: #3C3489; }
  .badge-later { background: #F1EFE8; color: #444441; }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 16px;
  }
  .stat {
    background: #f7f7f5; border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 3px; }
  .stat-value { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .input-area { margin-bottom: 16px; }
  .main-input {
    width: 100%; padding: 9px 12px; font-size: 14px;
    border: 1px solid #e0e0e0; border-radius: 8px;
    outline: none; color: #1a1a1a; background: #fff;
    margin-bottom: 8px;
  }
  .main-input:focus { border-color: #7F77DD; box-shadow: 0 0 0 2px #EEEDFE; }
  .meta-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .mini-input {
    font-size: 12px; padding: 6px 10px;
    border: 1px solid #e8e8e8; border-radius: 7px;
    background: #fafafa; color: #1a1a1a; outline: none;
    height: 32px; flex: 1; min-width: 110px;
  }
  .mini-input:focus { border-color: #7F77DD; }
  select.mini-input { cursor: pointer; min-width: 130px; flex: 0 0 auto; }
  .section { margin-bottom: 18px; }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: #aaa; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label .clear-btn {
    font-size: 11px; color: #bbb; cursor: pointer;
    font-weight: 400; text-transform: none; letter-spacing: 0;
  }
  .section-label .clear-btn:hover { color: #888; }
  .card {
    background: #fff; border: 1px solid #ebebeb;
    border-radius: 10px; padding: 4px 14px;
  }
  .empty {
    font-size: 13px; color: #ccc; padding: 14px 0; text-align: center;
  }
  .task-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid #f2f2f2;
  }
  .task-row:last-child { border-bottom: none; }
  .task-row:first-child { padding-top: 6px; }
  .task-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid #d0d0d0; cursor: pointer;
    flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; transition: all .15s;
  }
  .task-check:hover { border-color: #7F77DD; }
  .task-check.done { background: #7F77DD; border-color: #7F77DD; }
  .check-icon { display: none; width: 9px; height: 9px; }
  .task-check.done .check-icon { display: block; }
  .task-body { flex: 1; min-width: 0; }
  .task-text { font-size: 14px; color: #1a1a1a; word-break: break-word; }
  .task-text.done { color: #ccc; text-decoration: line-through; }
  .task-meta { display: flex; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
  .task-meta-item { font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 3px; }
  .task-del {
    font-size: 16px; color: #ddd; cursor: pointer;
    line-height: 1; padding: 1px; border-radius: 4px;
    opacity: 0; transition: opacity .15s; flex-shrink: 0;
    background: none; border: none;
  }
  .task-row:hover .task-del { opacity: 1; }
  .task-del:hover { color: #aaa; }
  .done-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #f2f2f2;
  }
  .done-row:last-child { border-bottom: none; }
  .done-icon {
    width: 16px; height: 16px; border-radius: 4px;
    background: #5DCAA5; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .done-body { flex: 1; min-width: 0; }
  .done-text { font-size: 13px; color: #ccc; text-decoration: line-through; }
  .done-time { font-size: 11px; color: #ccc; white-space: nowrap; margin-top: 1px; }
  svg.chk { width: 9px; height: 9px; stroke: #fff; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ 새 태스크 캡처</h1>
  <div class="date" id="today-date"></div>
  <div class="badges">
    <span class="badge badge-today" id="badge-today">오늘 0</span>
    <span class="badge badge-later" id="badge-later">나중 0</span>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-label">전체</div><div class="stat-value" id="cnt-total">0</div></div>
  <div class="stat"><div class="stat-label">오늘 할 것</div><div class="stat-value" id="cnt-today">0</div></div>
  <div class="stat"><div class="stat-label">완료</div><div class="stat-value" id="cnt-done">0</div></div>
</div>

<div class="input-area">
  <input class="main-input" id="task-input" type="text" placeholder="태스크 입력 후 엔터 →" autocomplete="off">
  <div class="meta-row">
    <input class="mini-input" id="deadline-input" type="text" placeholder="마감 (예: 금요일까지)">
    <input class="mini-input" id="time-input" type="text" placeholder="예상 시간 (예: 30분)">
    <select class="mini-input" id="bucket-select">
      <option value="today">🟢 오늘 할 것</option>
      <option value="later">🗂️ 나중 할 것</option>
    </select>
  </div>
</div>

<div class="section">
  <div class="section-label">🟢 오늘 할 것</div>
  <div class="card"><div id="today-list"><div class="empty">엔터로 태스크를 추가해보세요</div></div></div>
</div>

<div class="section">
  <div class="section-label">🗂️ 나중 할 것</div>
  <div class="card"><div id="later-list"><div class="empty">나중 할 것들이 여기 모입니다</div></div></div>
</div>

<div class="section">
  <div class="section-label">
    ✅ 완료 목록
    <span class="clear-btn" id="clear-btn">전체 삭제</span>
  </div>
  <div class="card"><div id="done-list"><div class="empty">완료한 태스크가 여기 모입니다</div></div></div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const taskInput = $('task-input');
  const deadlineInput = $('deadline-input');
  const timeInput = $('time-input');
  const bucketSelect = $('bucket-select');

  const days = ['일','월','화','수','목','금','토'];
  const now = new Date();
  $('today-date').textContent =
    now.getFullYear() + '년 ' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 (' + days[now.getDay()] + ')';

  const STORAGE_KEY = 'task_capture_v1';
  let state = { tasks: [], done: [], counter: 0 };

  function load() {
    try {
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) state = JSON.parse(s);
    } catch(e) {}
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function timeNow() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function renderTasks(listEl, items, bucket) {
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">' +
        (bucket === 'today' ? '엔터로 태스크를 추가해보세요' : '나중 할 것들이 여기 모입니다') +
        '</div>';
      return;
    }
    listEl.innerHTML = '';
    items.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task-row';
      row.innerHTML =
        '<div class="task-check" data-id="' + t.id + '">' +
          '<svg class="chk" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1"/></svg>' +
        '</div>' +
        '<div class="task-body">' +
          '<div class="task-text">' + esc(t.text) + '</div>' +
          (t.deadline || t.time ?
            '<div class="task-meta">' +
            (t.deadline ? '<span class="task-meta-item">📅 ' + esc(t.deadline) + '</span>' : '') +
            (t.time ? '<span class="task-meta-item">⏱ ' + esc(t.time) + '</span>' : '') +
            '</div>' : '') +
        '</div>' +
        '<button class="task-del" data-id="' + t.id + '" aria-label="삭제">×</button>';
      listEl.appendChild(row);

      row.querySelector('.task-check').addEventListener('click', function () {
        const id = +this.dataset.id;
        const idx = state.tasks.findIndex(x => x.id === id);
        if (idx !== -1) {
          const removed = state.tasks.splice(idx, 1)[0];
          state.done.unshift({ ...removed, doneAt: timeNow() });
          save(); render();
        }
      });
      row.querySelector('.task-del').addEventListener('click', function () {
        const id = +this.dataset.id;
        state.tasks = state.tasks.filter(x => x.id !== id);
        save(); render();
      });
    });
  }

  function renderDone() {
    const el = $('done-list');
    if (!state.done.length) {
      el.innerHTML = '<div class="empty">완료한 태스크가 여기 모입니다</div>';
      return;
    }
    el.innerHTML = '';
    state.done.forEach(t => {
      const row = document.createElement('div');
      row.className = 'done-row';
      row.innerHTML =
        '<div class="done-icon"><svg class="chk" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1"/></svg></div>' +
        '<div class="done-body">' +
          '<div class="done-text">' + esc(t.text) + '</div>' +
          (t.deadline || t.time ?
            '<div class="task-meta">' +
            (t.deadline ? '<span class="task-meta-item">' + esc(t.deadline) + '</span>' : '') +
            (t.time ? '<span class="task-meta-item">' + esc(t.time) + '</span>' : '') +
            '</div>' : '') +
        '</div>' +
        '<div class="done-time">' + t.doneAt + '</div>';
      el.appendChild(row);
    });
  }

  function render() {
    const todayTasks = state.tasks.filter(t => t.bucket === 'today');
    const laterTasks = state.tasks.filter(t => t.bucket === 'later');
    renderTasks($('today-list'), todayTasks, 'today');
    renderTasks($('later-list'), laterTasks, 'later');
    renderDone();
    $('cnt-total').textContent = state.tasks.length;
    $('cnt-today').textContent = todayTasks.length;
    $('cnt-done').textContent = state.done.length;
    $('badge-today').textContent = '오늘 ' + todayTasks.length;
    $('badge-later').textContent = '나중 ' + laterTasks.length;
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;
    state.tasks.push({
      id: ++state.counter,
      text,
      deadline: deadlineInput.value.trim(),
      time: timeInput.value.trim(),
      bucket: bucketSelect.value
    });
    taskInput.value = '';
    deadlineInput.value = '';
    timeInput.value = '';
    taskInput.focus();
    save(); render();
  }

  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  $('clear-btn').addEventListener('click', () => { state.done = []; save(); render(); });

  load(); render();
})();
</script>
</body>
</html>
